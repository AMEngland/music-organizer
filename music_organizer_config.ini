[GENERAL]
interactive_mode = false
create_playlists = true
extract_album_art = true
analyze_quality = true
find_near_duplicates = true
html_report = true

[FOLDERS]
skip_folders = System Volume Information, $RECYCLE.BIN, .Trash
# The tool's own folders are affixed so file managers list them above the
# artist folders instead of burying them among the bands.
manual_sort_folder = __Manual Sort Needed__
reports_folder = __Reports__
playlists_folder = __Playlists__
# Extra folder names that wrap a whole library rather than naming an artist,
# e.g. container_folders = All Music, Steves Rips, Backup 2019
container_folders =

[NAMING]
rename_files = true
filename_template = {track} - {title}
filename_template_no_track = {title}
max_component_length = 100
titlecase_names = true
# Comma-separated names whose casing must survive the title-case pass, on top
# of the built-in list. Example: name_exceptions = ACME, dEUS, THE KLF
name_exceptions =
# Write the resolved metadata into the organized copies (never the sources).
write_tags = false

[CLASSIFY]
# Classifications scoring below this (0-100) are queued for review.
review_threshold = 55
# true files low-confidence tracks under review_folder instead of the main tree.
route_review = false
review_folder = __Review__
# Work out from the tags which folders are containers rather than artists.
detect_containers = true

[FINGERPRINT]
# Identify unidentified tracks with Chromaprint + AcoustID. Needs fpcalc on
# PATH and a free API key from https://acoustid.org/new-application
# (or set the ACOUSTID_API_KEY environment variable). --fingerprint also
# enables this for a single run.
enabled = false
api_key =
fpcalc_path =
min_score = 0.7
# false submits every track, not only the ones metadata could not identify.
only_unidentified = true
# true treats different encodes of one recording as duplicates. Off by default:
# it discards files based on a network lookup rather than a byte-level fact.
merge_duplicate_encodes = false
rate_limit_per_second = 3

[PERFORMANCE]
# Processes used for hashing. 0 = auto, 1 = stay in one process.
workers = 0

[SIDECARS]
copy_sidecars = true
sidecar_extensions = .lrc, .cue, .log, .nfo, .txt
copy_folder_images = true

[QUALITY]
min_bitrate = 128
preferred_format = mp3
report_low_quality = true

[PLAYLISTS]
create_by_genre = true
create_by_year = true
create_by_artist = false
min_songs_for_playlist = 5


[GENERAL]
interactive_mode = false
create_playlists = true
extract_album_art = true
analyze_quality = true
find_near_duplicates = true

[FOLDERS]
skip_folders = System Volume Information, $RECYCLE.BIN, .Trash
manual_sort_folder = Manual Sort Needed

[NAMING]
rename_files = true
filename_template = {track} - {title}
filename_template_no_track = {title}
max_component_length = 100
titlecase_names = true
# Comma-separated names whose casing must survive the title-case pass, on top
# of the built-in list. Example: name_exceptions = ACME, dEUS, THE KLF
name_exceptions =

[CLASSIFY]
# Classifications scoring below this (0-100) are queued for review.
review_threshold = 55
# true files low-confidence tracks under review_folder instead of the main tree.
route_review = false
review_folder = Review

[QUALITY]
min_bitrate = 128
preferred_format = mp3
report_low_quality = true

[PLAYLISTS]
create_by_genre = true
create_by_year = true
create_by_artist = false
min_songs_for_playlist = 5

